name: CI

# Triggers list BOTH default-branch names on purpose. This repository's default
# branch is `master`; a workflow that only watches `main` is a workflow that
# never runs, and it reports nothing rather than reporting a failure -- which is
# indistinguishable from passing when you glance at the Actions tab.
#
# Everything here runs on CPU. There is no GPU job and no GPU-only code path:
# the package runs on whatever device JAX finds, and a test that only passes on
# an accelerator is a test nobody can reproduce.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Concurrency applies to PULL REQUESTS ONLY. Pushes get a group of their own,
# keyed on the run id, which is unique -- so a push neither cancels nor queues
# behind anything.
#
# Both of the obvious settings are wrong here, and each fails in its own way:
#
#   cancel-in-progress: true   -- every push killed the run still going from the
#     push before. `lint` (11 s) and `clean-install` (33 s) fit inside that
#     window and report success; `test` and `desc-absent`, the jobs that run the
#     suite, get cancelled partway through. The run reads green and has tested
#     nothing.
#   cancel-in-progress: false with a shared group -- runs serialize instead. The
#     suite takes a long while on a 4-vCPU runner, so the next push sits in
#     "pending" behind it, which looks from the outside exactly like nothing
#     running.
#
# Public-repository Actions minutes are free, so letting pushes run in parallel
# costs nothing and every commit gets its own answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAX_ENABLE_X64: "1"      # the eigenvalue's noise floor is 1e-10 in float64.
                           # In float32 the quantity being measured does not exist.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned, and pinned to the versions the tree was actually formatted with.
      # Black's output changes between releases, so an unpinned install turns
      # `--check` into a bet on what PyPI served that morning. These pins must
      # stay in step with .pre-commit-config.yaml.
      - run: pip install black==26.5.1 isort==8.0.1 flake8==7.3.0
      - run: black --check src tests examples tools
      - run: isort --check-only src tests examples tools
      # flake8 reads .flake8, NOT pyproject.toml -- it has no TOML support and
      # silently falls back to 79 columns. See the comment in .flake8.
      - run: flake8 src tests examples tools
      - name: agnimhd must never import DESC
        run: bash tools/check_no_desc.sh

  test:
    runs-on: ubuntu-latest
    # HARD 30-MINUTE LIMIT. Exceeding it fails the job -- it does not hang, and
    # it does not quietly report success the way a cancelled job did.
    #
    # This is a budget, not a measurement. The suite is ~13 minutes on a
    # 128-core node, every objective test runs a full dense assembly plus
    # eigensolve at the shipped resolution, and a runner has 4 vCPUs, so
    # overrunning 30 minutes is a real possibility. If that happens, the answer
    # is NOT to lower the resolution -- that tests a different problem. It is to
    # raise this number deliberately, or to cut the duplicated work (see the
    # note on `desc-absent`, which runs the same suite a second time).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.12 only, and that is a measured constraint rather than laziness:
        # jax 0.11 declares `Requires-Python >= 3.12`. An older Python resolves
        # to an older jax that this package has never been run against, and a
        # matrix entry that installs an untested dependency set reports on
        # something other than the code.
        python-version: ["3.12"]
        # SPLIT ACROSS RUNNERS, NOT ACROSS CORES. pytest-xdist would put four
        # workers on one runner, and each worker rebuilds the session-scoped
        # dense assembly and keeps its own JAX compile cache: measured 6.12 GB
        # peak for ONE process, against a runner's 16 GB. An OOM-killed xdist
        # worker also reports as a crashed test, not as a memory error. Separate
        # jobs each get their own 16 GB, so the memory profile is unchanged.
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[test,hdf5,plot]"
      - name: The fixtures must be present
        # A missing fixture FAILS, it never skips. A blanket binary rule in
        # .gitignore once kept an equilibrium out of a repository, CI skipped
        # most of the solver suite, and the solver was reported as tested.
        run: |
          git ls-files --error-unmatch tests/data/qh_lowres_24x12x8.npz
          git ls-files --error-unmatch tests/data/qh_lowres_24x12x8.json
          git ls-files --error-unmatch tests/data/qh_lowres_16x12x8.npz
          git ls-files --error-unmatch tests/data/qh_lowres_16x12x8.json
          git ls-files --error-unmatch tests/data/zernike_reference.npz
      - name: The duration file must cover every test
        # pytest-split WARNS and silently falls back to equal-count splitting
        # when a test is missing from .test_durations. Equal-count is useless
        # here -- test_objective.py holds ~20 tests at ~50 s each while
        # test_zernike.py holds 20 that are near-instant -- so one group would
        # carry most of the suite and the split would buy nothing. A stale
        # duration file is exactly what made DESC's splitting ineffective
        # (dated June 2025, missing 294 of 647 tests), and nothing announced it.
        run: |
          python - <<'PY'
          import json, subprocess, sys
          have = set(json.load(open(".test_durations")))
          out = subprocess.run(
              [sys.executable, "-m", "pytest", "tests", "--collect-only", "-q",
               "--no-header", "-p", "no:cacheprovider"],
              capture_output=True, text=True, check=True).stdout
          want = {ln for ln in out.splitlines() if "::" in ln}
          missing = sorted(want - have)
          if missing:
              print(f"{len(missing)} test(s) missing from .test_durations:")
              for m in missing[:20]:
                  print("   ", m)
              print("\nRegenerate with:")
              print("    pytest tests --store-durations --durations-path .test_durations")
              raise SystemExit(1)
          print(f".test_durations covers all {len(want)} collected tests")
          PY
      - name: Test
        # -v, not -q: if the job hits the 30-minute wall the log is cut off
        # where it stands, and a column of dots does not say which test was
        # running. --durations reports the worst offenders when it does finish.
        #
        # `least_duration` rather than the default: it packs by measured cost
        # instead of by position, which is what keeps the four groups even.
        #
        # No --cov-report here. Each group exercises only part of the package,
        # so a per-group report is meaningless and the >90% gate would fail in
        # every one of them. The raw data is combined in the `coverage` job.
        run: >
          pytest tests -v --durations=15
          --splits 4 --group ${{ matrix.group }}
          --splitting-algorithm least_duration
          --cov=agnimhd --cov-report=
      - name: Save this group's raw coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.group }}
          path: .coverage
          include-hidden-files: true
          retention-days: 1

  coverage:
    # The >90% gate, run ONCE on the combined data. It cannot live in `test`
    # any more: with the suite split four ways each group covers roughly a
    # quarter of the package, so the gate would fail everywhere and mean
    # nothing. This job is also the single codecov upload.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # The PACKAGE, not just `coverage`. `[tool.coverage.run] source` is
        # "agnimhd" -- a package name, deliberately, because handing coverage a
        # file path silently measures nothing -- and resolving that name at
        # report time needs the package importable. Installing only `coverage`
        # here risks "No source for code" against data that is perfectly good.
        run: pip install -e ".[test]"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: parts
      - name: Combine
        # `coverage combine` consumes its inputs, so the parts are copied to
        # distinct names first -- four files all called `.coverage` in separate
        # directories would otherwise collide on the way in.
        run: |
          i=0
          for f in parts/coverage-*/.coverage; do
            i=$((i+1)); cp "$f" ".coverage.$i"
          done
          test "$i" -eq 4 || { echo "expected 4 coverage parts, got $i"; exit 1; }
          coverage combine
          coverage xml
          coverage report
      - name: Coverage gate
        # >90% overall. The bar is not decoration: the parts of this package
        # that are not exercised are the parts where a wrong number would go
        # unnoticed.
        run: coverage report --fail-under=90
      - uses: codecov/codecov-action@v5
        # v5 IS THE FIX, and a token is NOT needed. v4 failed on this repo and
        # did so silently. Measured on run 32348021152 (2026-08-20), v4:
        #
        #   warning -- Branch `master` is protected but no token was provided
        #   error   -- Commit creating failed:
        #              {"message":"Token required - not valid tokenless upload"}
        #
        # and on run 33720029929 (2026-09-03), v5, with no secret set at all:
        #
        #   -> Token length: 0
        #   info -- Your upload is now queued for processing
        #   info -- Upload queued for processing complete
        #
        # v4 called `create-commit`, which refuses a tokenless write to a
        # protected branch. v5 uses `upload-coverage`, which does not. The badge
        # went from 0% to 93.3% on that run. Do NOT add a CODECOV_TOKEN secret
        # expecting it to matter here -- it is not what was broken.
        #
        # `fail_ci_if_error: true` because the earlier `false` is exactly what
        # hid the v4 failure for two weeks: CI reported success while codecov
        # received nothing. The correctness gate is `coverage report
        # --fail-under=90` above, which runs whether or not this step succeeds.
        with:
          files: coverage.xml
          fail_ci_if_error: true

  desc-absent:
    # The dependency direction is the whole point of this package: DESC depends
    # on agnimhd, never the reverse. This job asserts it in the only way that
    # cannot be fooled by a lazy import -- a clean environment with DESC
    # genuinely absent, running the entire suite.
    runs-on: ubuntu-latest
    # Same hard 30-minute limit as `test`. This job runs the whole suite a
    # second time, in an environment where DESC is genuinely absent, so it is
    # the other half of the CI wall-clock bill -- and it is split the same way
    # for the same reason.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test,hdf5]"
      - name: DESC must not be installed
        run: |
          python - <<'PY'
          import importlib.util, sys
          assert importlib.util.find_spec("desc") is None, "DESC is installed in the DESC-absent job"
          import agnimhd
          assert "desc" not in sys.modules
          print("agnimhd imports with no DESC present:", agnimhd.__version__)
          PY
      - run: >
          pytest tests -v --durations=15
          --splits 4 --group ${{ matrix.group }}
          --splitting-algorithm least_duration

  clean-install:
    # Build a wheel and install it into a fresh environment, from the wheel
    # only. Catches a package that works from a source checkout because of the
    # repository layout and not because it was packaged correctly -- a missing
    # entry in [tool.setuptools.packages.find], an undeclared dependency, a data
    # file that only exists in git.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel, away from the source tree
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
      - name: The declared dependencies must be exactly four
        run: |
          /tmp/fresh/bin/python - <<'PY'
          import re
          from importlib.metadata import requires

          # Split on the first version specifier, marker, or extra bracket.
          # A naive `.split('>')[0].split('=')[0]` gets "matfree<0.6,>=0.5.5"
          # wrong -- it leaves "matfree<0.6," -- which is how a green job can
          # assert nothing at all.
          names = sorted(
              re.split(r"[<>=!~;\[\s]", r, maxsplit=1)[0].strip()
              for r in requires("agnimhd")
              if "extra ==" not in r
          )
          assert names == ["jax", "matfree", "numpy", "scipy"], names
          print("direct dependencies:", names)
          PY
      - name: The console script works
        run: |
          cd /tmp
          /tmp/fresh/bin/agnimhd --version
          /tmp/fresh/bin/agnimhd info
